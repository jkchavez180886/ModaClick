<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Gestión de usuarios | ModaClick</title><link rel="icon" href="../assets/img/logo.png"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/layout.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/pages/cuentas.css"></head>
<body data-titulo="Gestión de usuarios"><div class="preloader" id="preloader"><div></div></div><div class="app"><aside class="app-sidebar" id="app-sidebar"></aside><div class="app-contenido"><header class="app-header" id="app-header"></header><main class="app-main"><div class="contenedor"><div class="encabezado-pagina"><h2 class="titulo-pagina">Gestión de usuarios</h2><nav class="migas" aria-label="Ruta de navegación"><a href="dashboard-admin.html">Inicio</a><span>/</span><span class="actual" aria-current="page">Gestión de usuarios</span></nav></div><section class="tarjeta cuenta-form"><div class="tarjeta-cabecera"><h3 id="titulo-form-cuenta">Crear usuario</h3><button id="nuevo-usuario" type="button" class="btn btn-secundario">Nuevo usuario</button></div><form id="form-cuenta" class="tarjeta-cuerpo"><div class="campos-doble"><div class="campo"><label for="cuenta-nombre">Nombre completo *</label><input id="cuenta-nombre" type="text" required maxlength="100" autocomplete="name"></div><div class="campo"><label for="cuenta-correo">Correo *</label><input id="cuenta-correo" type="email" required maxlength="150" autocomplete="email"></div><div class="campo"><label for="cuenta-telefono">Teléfono</label><input id="cuenta-telefono" type="tel" pattern="[0-9]{9}" maxlength="9" autocomplete="tel"></div><div class="campo"><label for="cuenta-direccion">Dirección</label><input id="cuenta-direccion" type="text" maxlength="250" autocomplete="street-address"></div><div class="campo"><label for="cuenta-rol">Tipo de usuario *</label><select id="cuenta-rol"><option value="estandar">Estándar</option><option value="admin">Admin</option></select></div><label class="campo-opcion"><input type="checkbox" id="cuenta-activo" checked> Usuario activo</label><div class="campo"><label for="cuenta-clave">Contraseña (obligatoria al crear)</label><input id="cuenta-clave" type="password" minlength="6" maxlength="128" autocomplete="new-password"></div></div><p class="texto-pequeno">Admin administra la configuración y los registros. Estándar consulta el catálogo y realiza pedidos. Al editar, deja la contraseña vacía para conservarla.</p><p id="error-cuenta" class="error-formulario" role="alert"></p><button id="guardar-cuenta" type="submit" class="btn btn-primario">Guardar cambios</button></form></section><section class="tarjeta"><div class="tarjeta-cabecera"><h3>Usuarios registrados</h3></div><div class="tarjeta-cuerpo"><div class="campos-doble"><div class="campo"><label for="buscar-usuarios">Buscar usuarios</label><input id="buscar-usuarios" type="search" placeholder="Nombre o correo"></div><div class="campo"><label for="filtrar-rol">Tipo de usuario</label><select id="filtrar-rol"><option value="">Todos</option><option value="admin">Admin</option><option value="estandar">Estándar</option></select></div></div><div class="tabla-envoltura"><table class="tabla"><thead><tr><th>Nombre</th><th>Correo</th><th>Tipo</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="lista-usuarios"></tbody></table></div><p class="conteo" id="conteo-usuarios"></p></div></section></div></main><footer class="app-footer" id="app-footer"></footer></div></div><div class="capa" id="capa"></div>
<script defer src="../js/utils.js"></script><script defer src="../js/datos/usuarios.js"></script><script defer src="../js/auth.js"></script><script defer src="../js/layout.js"></script><script defer src="../js/app.js"></script><script defer src="../js/pages/cuentas.js"></script></body></html>
