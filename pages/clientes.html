<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes | ModaClick</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/marca-icono.svg">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages/crud.css">
</head>

<body data-titulo="Clientes">

  <div class="preloader" id="preloader"><div></div></div>

  <div class="app">

    <aside class="app-sidebar" id="app-sidebar"></aside>

    <div class="app-contenido">

      <header class="app-header" id="app-header"></header>

      <main class="app-main">
        <div class="contenedor">

          <div class="encabezado-pagina">
            <h2 class="titulo-pagina">Clientes</h2>
            <nav class="migas" aria-label="Ruta de navegación">
              <a href="dashboard-admin.html">Inicio</a>
              <span aria-hidden="true">/</span>
              <span class="actual" aria-current="page">Clientes</span>
            </nav>
          </div>

          <div class="rejilla" style="gap:22px">

            <!-- Listado -->
            <section class="tarjeta">
              <div class="tarjeta-cabecera">
                <h3>Listado de clientes</h3>

                <div class="herramientas">
                  <label class="campo-busqueda">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="search" id="buscar-cliente"
                           placeholder="Buscar por nombre, teléfono o correo">
                  </label>
                  <button type="button" class="btn btn-primario" id="nuevo-cliente">
                    <i class="fa-solid fa-plus"></i> Nuevo cliente
                  </button>
                </div>
              </div>

              <div class="tarjeta-cuerpo">
                <div class="tabla-envoltura">
                  <table class="tabla">
                    <thead>
                      <tr>
                        <th>Código</th>
                        <th>Nombres y apellidos</th>
                        <th>Teléfono</th>
                        <th>Correo</th>
                        <th>Talla</th>
                        <th>Contacto preferido</th>
                        <th class="col-acciones">Acciones</th>
                      </tr>
                    </thead>
                    <tbody id="cuerpo-clientes"></tbody>
                  </table>
                </div>
                <p class="conteo" id="conteo-clientes"></p>
              </div>
            </section>

            <!-- Formulario de alta / edición -->
            <section class="tarjeta oculto" id="formulario-cliente">
              <div class="tarjeta-cabecera">
                <h3 id="titulo-formulario">Nuevo cliente</h3>
              </div>

              <div class="tarjeta-cuerpo">
                <div class="campos-doble">
                  <div class="campo">
                    <label for="cli-codigo">Código de cliente</label>
                    <input type="text" id="cli-codigo" readonly
                           placeholder="Se genera automáticamente">
                  </div>

                  <div class="campo">
                    <label for="cli-nombre">Nombres y apellidos <span class="obligatorio">*</span></label>
                    <input type="text" id="cli-nombre" placeholder="Nombre completo del cliente">
                  </div>

                  <div class="campo">
                    <label for="cli-telefono">Teléfono <span class="obligatorio">*</span></label>
                    <input type="text" id="cli-telefono" inputmode="numeric" maxlength="9"
                           placeholder="9 dígitos">
                  </div>

                  <div class="campo">
                    <label for="cli-correo">Correo electrónico</label>
                    <input type="text" id="cli-correo" placeholder="correo@ejemplo.com">
                  </div>

                  <div class="campo">
                    <label for="cli-talla">Talla preferida</label>
                    <select id="cli-talla">
                      <option value="">Seleccione</option>
                      <option>XS</option>
                      <option>S</option>
                      <option>M</option>
                      <option>L</option>
                      <option>XL</option>
                      <option>XXL</option>
                    </select>
                  </div>

                  <div class="campo">
                    <label for="cli-contacto">Preferencia de contacto</label>
                    <select id="cli-contacto">
                      <option value="">Seleccione</option>
                      <option>WhatsApp</option>
                      <option>Llamada</option>
                      <option>Correo</option>
                    </select>
                  </div>

                  <div class="campo ancho-total">
                    <label for="cli-direccion">Dirección</label>
                    <input type="text" id="cli-direccion" placeholder="Ingrese la dirección">
                  </div>
                </div>

                <p class="error-formulario" id="error-cliente"></p>
              </div>

              <div class="tarjeta-cuerpo formulario-acciones">
                <button type="button" class="btn btn-primario" id="guardar-cliente">
                  Guardar cliente
                </button>
                <button type="button" class="btn btn-secundario" id="cancelar-cliente">
                  Cancelar
                </button>
              </div>
            </section>

          </div>
        </div>
      </main>

      <footer class="app-footer" id="app-footer"></footer>
    </div>
  </div>

  <div class="capa" id="capa"></div>

  <script defer src="../js/utils.js"></script>
<script defer src="../js/tablas.js"></script>
  <script defer src="../js/datos/usuarios.js"></script>
  <script defer src="../js/auth.js"></script>
  <script defer src="../js/datos/clientes.js"></script>
  <script defer src="../js/layout.js"></script>
  <script defer src="../js/app.js"></script>
  <script defer src="../js/pages/clientes.js"></script>
</body>
</html>
