<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mi perfil | ModaClick</title><link rel="icon" type="image/svg+xml" href="../assets/img/marca-icono.svg"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/layout.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/pages/cuentas.css"></head>
<body data-titulo="Mi perfil"><div class="preloader" id="preloader"><div></div></div><div class="app"><aside class="app-sidebar" id="app-sidebar"></aside><div class="app-contenido"><header class="app-header" id="app-header"></header><main class="app-main"><div class="contenedor"><div class="encabezado-pagina"><h2 class="titulo-pagina">Mi perfil</h2><nav class="migas" aria-label="Ruta de navegación"><a href="dashboard-admin.html">Inicio</a><span>/</span><span class="actual" aria-current="page">Mi perfil</span></nav></div><section class="tarjeta cuenta-form"><div class="tarjeta-cabecera"><h3 id="titulo-form-cuenta">Editar mi perfil</h3><span id="rol-perfil" class="etiqueta"></span></div><form id="form-cuenta" class="tarjeta-cuerpo"><div class="campos-doble"><div class="campo"><label for="cuenta-nombre">Nombre completo *</label><input id="cuenta-nombre" type="text" required maxlength="100" autocomplete="name"></div><div class="campo"><label for="cuenta-correo">Correo *</label><input id="cuenta-correo" type="email" required maxlength="150" autocomplete="email"></div><div class="campo"><label for="cuenta-telefono">Teléfono</label><input id="cuenta-telefono" type="tel" pattern="[0-9]{9}" maxlength="9" autocomplete="tel"></div><div class="campo"><label for="cuenta-direccion">Dirección</label><input id="cuenta-direccion" type="text" maxlength="250" autocomplete="street-address"></div><div class="campo"><label for="cuenta-clave-actual">Contraseña actual</label><input id="cuenta-clave-actual" type="password" autocomplete="current-password" maxlength="128"></div><div class="campo"><label for="cuenta-clave">Nueva contraseña (opcional)</label><input id="cuenta-clave" type="password" minlength="6" maxlength="128" autocomplete="new-password"></div></div><p class="texto-pequeno">Para cambiar el correo o la contraseña debes ingresar tu contraseña actual.</p><p id="error-cuenta" class="error-formulario" role="alert"></p><button id="guardar-cuenta" type="submit" class="btn btn-primario">Guardar cambios</button></form></section></div></main><footer class="app-footer" id="app-footer"></footer></div></div><div class="capa" id="capa"></div>
<script defer src="../js/utils.js"></script><script defer src="../js/datos/usuarios.js"></script><script defer src="../js/auth.js"></script><script defer src="../js/layout.js"></script><script defer src="../js/app.js"></script><script defer src="../js/pages/cuentas.js"></script></body></html>
