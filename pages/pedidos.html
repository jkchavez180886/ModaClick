<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos | ModaClick</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/marca-icono.svg">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages/crud.css">
</head>

<body data-titulo="Consulta de pedidos">

  <div class="preloader" id="preloader"><div></div></div>

  <div class="app">

    <aside class="app-sidebar" id="app-sidebar"></aside>

    <div class="app-contenido">

      <header class="app-header" id="app-header"></header>

      <main class="app-main">
        <div class="contenedor">

          <div class="encabezado-pagina">
            <h2 class="titulo-pagina">Pedidos</h2>
            <nav class="migas" aria-label="Ruta de navegación">
              <a href="dashboard-admin.html">Inicio</a>
              <span aria-hidden="true">/</span>
              <span class="actual" aria-current="page">Pedidos</span>
            </nav>
          </div>

          <div class="rejilla" style="gap:22px">

            <!-- Listado -->
            <section class="tarjeta">
              <div class="tarjeta-cabecera">
                <h3>Listado de pedidos</h3>

                <div class="herramientas">
                  <label class="campo-busqueda">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="search" id="buscar-pedido"
                           placeholder="Buscar por código, cliente o dirección">
                  </label>

                  <select class="filtro-estado" id="filtro-estado-pedido">
                    <option value="Todos">Todos los estados</option>
                  </select>

                  <button type="button" class="btn btn-primario" id="nuevo-pedido">
                    <i class="fa-solid fa-plus"></i> Nuevo pedido
                  </button>
                </div>
              </div>

              <div class="tarjeta-cuerpo">
                <div class="tabla-envoltura">
                  <table class="tabla">
                    <thead>
                      <tr>
                        <th>Código</th>
                        <th>Cliente</th>
                        <th>Fecha pedido</th>
                        <th>Fecha entrega</th>
                        <th>Método de pago</th>
                        <th>Tipo de entrega</th>
                        <th>Dirección</th>
                        <th>Total</th>
                        <th>Estado</th>
                        <th>Observaciones</th>
                        <th class="col-acciones">Acciones</th>
                      </tr>
                    </thead>
                    <tbody id="cuerpo-pedidos"></tbody>
                  </table>
                </div>
                <p class="conteo" id="conteo-pedidos"></p>
              </div>
            </section>

            <!-- Formulario de alta / edición -->
            <section class="tarjeta oculto" id="formulario-pedido">
              <div class="tarjeta-cabecera">
                <h3 id="titulo-formulario">Nuevo pedido</h3>
              </div>

              <div class="tarjeta-cuerpo">
                <div class="campos-doble">
                  <div class="campo">
                    <label for="ped-codigo">Código de pedido</label>
                    <input type="text" id="ped-codigo" readonly
                           placeholder="Se genera automáticamente">
                  </div>

                  <div class="campo">
                    <label for="ped-cliente">Cliente <span class="obligatorio">*</span></label>
                    <input type="text" id="ped-cliente" placeholder="Nombre completo del cliente">
                  </div>

                  <div class="campo">
                    <label for="ped-fecha-pedido">Fecha de pedido <span class="obligatorio">*</span></label>
                    <input type="date" id="ped-fecha-pedido">
                  </div>

                  <div class="campo">
                    <label for="ped-fecha-entrega">Fecha de entrega estimada <span class="obligatorio">*</span></label>
                    <input type="date" id="ped-fecha-entrega">
                  </div>

                  <div class="campo">
                    <label for="ped-metodo-pago">Método de pago</label>
                    <select id="ped-metodo-pago"></select>
                  </div>

                  <div class="campo">
                    <label for="ped-tipo-entrega">Tipo de entrega</label>
                    <select id="ped-tipo-entrega"></select>
                  </div>

                  <div class="campo">
                    <label for="ped-estado">Estado del pedido</label>
                    <select id="ped-estado"></select>
                  </div>

                  <div class="campo ancho-total">
                    <label for="ped-direccion">Dirección de envío</label>
                    <input type="text" id="ped-direccion"
                           placeholder="Ingrese la dirección (si es delivery)">
                  </div>

                  <div class="campo">
                    <label for="ped-total">Total del pedido (S/)</label>
                    <input type="number" id="ped-total" min="0" step="0.01" placeholder="0.00">
                  </div>

                  <div class="campo ancho-total">
                    <label for="ped-observaciones">Observaciones</label>
                    <textarea id="ped-observaciones" rows="3"
                              placeholder="Notas adicionales del pedido"></textarea>
                  </div>
                </div>

                <p class="error-formulario" id="error-pedido"></p>
              </div>

              <div class="tarjeta-cuerpo formulario-acciones">
                <button type="button" class="btn btn-primario" id="guardar-pedido">
                  Guardar pedido
                </button>
                <button type="button" class="btn btn-secundario" id="cancelar-pedido">
                  Cancelar
                </button>
              </div>
            </section>

          </div>
        </div>
      </main>

      <footer class="app-footer" id="app-footer"></footer>
    </div>
  </div>

  <div class="capa" id="capa"></div>

  <script defer src="../js/utils.js"></script>
<script defer src="../js/tablas.js"></script>
  <script defer src="../js/datos/usuarios.js"></script>
  <script defer src="../js/auth.js"></script>
  <script defer src="../js/datos/pedidos.js"></script>
  <script defer src="../js/layout.js"></script>
  <script defer src="../js/app.js"></script>
  <script defer src="../js/pages/pedidos.js"></script>
</body>
</html>
