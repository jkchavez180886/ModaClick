<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ModaClick | Tu Estilo en un Click</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/marca-icono.svg">

  <!-- Estilos: base primero (define las variables), luego componentes y los de la página -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/login.css">
</head>

<body class="login-body">

  <!-- Panel izquierdo: marca -->
  <section class="login-marca">
    <img src="assets/img/marca-login.svg" alt="ModaClick" class="login-logo" width="320" height="76">

    <img src="assets/img/decoracion/grid.svg" alt="" class="login-deco deco-1">
    <img src="assets/img/decoracion/grid.svg" alt="" class="login-deco deco-2">

    <div class="login-marca-texto">
      <h2>Tu Estilo en un Click</h2>
      <p>Tienda virtual de prendas de vestir y accesorios.</p>
    </div>
  </section>

  <!-- Panel derecho: formulario -->
  <main class="login-formulario">
    <div class="login-caja">

      <h1>Bienvenido</h1>
      <p class="login-subtitulo">Ingresa tu usuario y clave para iniciar sesión.</p>

      <form id="form-login" novalidate>
        <div class="campo">
          <label for="usuario">Usuario <span class="obligatorio">*</span></label>
          <input type="email" id="usuario" name="usuario" placeholder="Ingresa tu usuario" autocomplete="username">
        </div>

        <div class="campo">
          <label for="clave">Clave <span class="obligatorio">*</span></label>
          <input type="password" id="clave" name="clave" placeholder="Ingresa tu clave" autocomplete="current-password">
        </div>

        <p class="error-formulario" id="login-error"></p>

        <button type="submit" class="btn btn-primario btn-bloque">Iniciar sesión</button>
      </form>

      <p class="login-pie">
        ¿No tienes una cuenta? <a href="pages/catalogo.html">Explora como invitado</a>
      </p>
    </div>
  </main>

  <!-- Scripts: utils primero (lo usan los demás), luego el de la página -->
  <script defer src="js/utils.js"></script>
  <script defer src="js/datos/usuarios.js"></script>
  <script defer src="js/pages/login.js"></script>
</body>

</html>
